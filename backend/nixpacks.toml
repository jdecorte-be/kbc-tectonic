# Nixpacks build (Railway / Coolify / `nixpacks build ./backend`)
# Required env: DATABASE_URL, CORS_ORIGINS (comma-separated frontend origins), JEV_API_KEY (optional)

[phases.setup]
nixPkgs = ["python311", "postgresql"]

[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers ${WEB_CONCURRENCY:-1} --proxy-headers --forwarded-allow-ips='*'"
