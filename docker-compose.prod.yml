# Production overrides: built images, no bind mounts, no hot reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#   (or: make prod-up)

services:
  db:
    restart: always
    ports: !reset []

  backend:
    build:
      target: prod
    restart: always
    volumes: !reset []
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}

  frontend:
    build:
      target: prod
    restart: always
    volumes: !reset []
    environment:
      NODE_ENV: production

  client_frontend:
    build:
      target: prod
    restart: always
    volumes: !reset []
    environment: !reset {}

  adminer:
    profiles: ["tools"]
