services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kbc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - bank_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kbc"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/kbc}
      GENERATED_CLIENT_COUNT: ${GENERATED_CLIENT_COUNT:-1000}
      JEV_API: ${JEV_API:-}
      JEV_API_URL: ${JEV_API_URL:-https://api.typesafe.ai/v1/systemone}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_INPUT_USD_PER_MILLION: ${JEV_INPUT_USD_PER_MILLION:-0.042}
      JEV_OUTPUT_USD_PER_MILLION: ${JEV_OUTPUT_USD_PER_MILLION:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_INPUT_USD_PER_MILLION: ${OPENAI_INPUT_USD_PER_MILLION:-0.40}
      OPENAI_OUTPUT_USD_PER_MILLION: ${OPENAI_OUTPUT_USD_PER_MILLION:-1.60}
      CATEGORY_DB_PATH: /workspace/data/categories.sqlite3
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - category_data:/workspace/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_API_BASE: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  category_data:
  bank_data:
